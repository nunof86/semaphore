name: Deploy via Semaphore

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: [self-hosted, Linux, X64]

    steps:
      # 🔎 STEP 1 — DEBUG (temporário)
      - name: Check Semaphore auth (debug)
        shell: bash
        env:
          SEMAPHORE_URL: ${{ secrets.SEMAPHORE_URL }}
          SEMAPHORE_TOKEN: ${{ secrets.SEMAPHORE_TOKEN }}
        run: |
          set -euo pipefail

          echo "SEMAPHORE_URL=${SEMAPHORE_URL}"
          echo "SEMAPHORE_TOKEN_LEN=${#SEMAPHORE_TOKEN}"

          code="$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${SEMAPHORE_TOKEN}" \
            -H "Accept: application/json" \
            "${SEMAPHORE_URL}/api/projects")"

          echo "HTTP=${code}"
          if [[ "${code}" != "200" ]]; then
            echo "ERROR: Semaphore auth failed"
            exit 1
          fi

      # 🚀 STEP 2 — CREATE TASK (normal)
      - name: Create Semaphore task
        shell: bash
        env:
          SEMAPHORE_URL: ${{ secrets.SEMAPHORE_URL }}
          SEMAPHORE_TOKEN: ${{ secrets.SEMAPHORE_TOKEN }}
          PROJECT_ID: ${{ secrets.SEMAPHORE_PROJECT_ID }}
          TEMPLATE_ID: ${{ secrets.SEMAPHORE_TEMPLATE_ID }}
        run: |
          set -euo pipefail

          curl -sS -L -X POST \
            -H "Authorization: Bearer ${SEMAPHORE_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "{\"template_id\": ${TEMPLATE_ID}}" \
            "${SEMAPHORE_URL}/api/project/${PROJECT_ID}/tasks"
