name: Deploy via Semaphore outro

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  trigger:
    # Se estás a usar self-hosted runner (homelab), mantém assim.
    # Se quiseres testar em GitHub-hosted, muda para: ubuntu-latest
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Create Semaphore task (fail-fast)
        shell: bash
        env:
          SEMAPHORE_URL: ${{ secrets.SEMAPHORE_URL }}
          SEMAPHORE_TOKEN: ${{ secrets.SEMAPHORE_TOKEN }}
          PROJECT_ID: ${{ secrets.SEMAPHORE_PROJECT_ID }}
          TEMPLATE_ID: ${{ secrets.SEMAPHORE_TEMPLATE_ID }}
        run: |
          set -euo pipefail

          echo "SEMAPHORE_URL=${SEMAPHORE_URL}"
          echo "PROJECT_ID=${PROJECT_ID}"
          echo "TEMPLATE_ID=${TEMPLATE_ID}"
          echo "SEMAPHORE_TOKEN_LEN=${#SEMAPHORE_TOKEN}"

          # 1) Check API reachability (no auth) - optional but helpful
          #    If your Semaphore requires auth for everything, this may return 401 which is OK.
          echo "Checking Semaphore API reachability..."
          reach_code="$(curl -sS -o /dev/null -w "%{http_code}" \
            "${SEMAPHORE_URL}/api/projects" || true)"
          echo "Reachability HTTP=${reach_code}"

          # 2) Check authentication (must be 200)
          echo "Checking Semaphore API authentication..."
          auth_code="$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${SEMAPHORE_TOKEN}" \
            -H "Accept: application/json" \
            "${SEMAPHORE_URL}/api/projects" || true)"
          echo "Auth HTTP=${auth_code}"

          if [[ "${auth_code}" != "200" ]]; then
            echo "ERROR: /api/projects returned HTTP=${auth_code}"
            echo "Hint: 401/403=token wrong/permissions; 000=network; 404=url/path wrong"
            exit 1
          fi

          # 3) Create task
          echo "Creating Semaphore task..."
          create_resp="$(curl -sS -i -X POST \
            -H "Authorization: Bearer ${SEMAPHORE_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "{\"template_id\": ${TEMPLATE_ID}}" \
            "${SEMAPHORE_URL}/api/project/${PROJECT_ID}/tasks")"

          echo "${create_resp}" | head -n 20

          # 4) Ensure we got 201 Created and a task id
          http_line="$(echo "${create_resp}" | head -n 1)"
          if ! echo "${http_line}" | grep -q " 201 "; then
            echo "ERROR: Expected HTTP 201 from task creation, got: ${http_line}"
            exit 1
          fi

          task_id="$(echo "${create_resp}" | tail -n 1 | sed -n 's/.*"id":\([0-9]\+\).*/\1/p' | head -n 1)"
          if [[ -z "${task_id}" ]]; then
            echo "ERROR: Could not parse task id from response body"
            exit 1
          fi

          echo "Semaphore task created successfully. TASK_ID=${task_id}"
